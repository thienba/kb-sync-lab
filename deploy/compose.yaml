# kbsync stack. Lives in /opt/kbsync on the server (see docs/runbook.md).
# No service publishes a host port: public access is only through the Cloudflare Tunnel.
name: kbsync

services:
  web:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    user: "10001"
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The caddy binary carries the cap_net_bind_service file capability; without it in the
    # bounding set the exec fails. Nothing binds a privileged port (we listen on 8080).
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [web]

  job:
    profiles: [job]
    image: kbsync:local
    user: "10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    volumes:
      - ./public:/public
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      VECTOR_STORE_NAME: ${VECTOR_STORE_NAME:-optibot-kb}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
