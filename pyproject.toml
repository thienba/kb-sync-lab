[project]
name = "kbsync"
version = "0.1.0"
description = "Sync a help-centre knowledge base into an OpenAI vector store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "python-dotenv>=1.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "pyyaml>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbsync"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
